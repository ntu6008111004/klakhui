name: test-and-deploy
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm --prefix worker ci
      - run: npm test
      - run: npx --prefix worker tsc --noEmit -p worker

  deploy:
    needs: test   # test ไม่ผ่าน = ไม่ deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm --prefix worker ci
      - name: Deploy Worker
        run: npx --prefix worker wrangler deploy --config worker/wrangler.toml
      - name: Deploy Pages
        run: npx --prefix worker wrangler pages deploy app --project-name klakhui --branch main
